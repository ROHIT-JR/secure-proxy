name: CI

on:
  push:
    branches: [main]
  pull_request:  # any base branch, so stacked pull requests are checked too

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build (strict warnings) and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build with strict warnings
        run: make

      - name: Run test suite
        run: make test

      - name: Run concurrent load test
        run: make load-test

  sanitize:
    name: AddressSanitizer + UndefinedBehaviorSanitizer
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build sanitizer binaries
        run: make sanitize

      - name: Run test suite under sanitizers
        run: make test

      - name: Run concurrent load test under sanitizers (also checks for leaks at shutdown)
        run: make load-test-sanitize

  valgrind:
    # Non-blocking: reports memory errors found by Valgrind without failing the pull request.
    # (It was added without being run on a machine with Valgrind installed, so treat its first
    # results as a check of the job itself as well as of the code.)
    name: Valgrind (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Run unit tests and a short load test under Valgrind
        run: make valgrind
