name: CodeQL

on:
  push:
    branches: [main]
  pull_request:  # any base branch, matching ci.yml

# Default to read-only; the single job below raises only what CodeQL needs.
permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (C/C++)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # required to upload CodeQL results; no other write access
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual

      - name: Build
        run: make

      - name: Analyse
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c-cpp"
