name: Feature request
description: Suggest a new feature or improvement for SecureBrowse.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What is missing or difficult today?
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Proposed value
      description: What would this feature let a user, contributor, or examiner do that they cannot do now?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why you preferred this one.
  - type: textarea
    id: security-impact
    attributes:
      label: Security and privacy impact
      description: >
        Does this feature touch untrusted network input, private addresses, logs, cache, or a
        third-party service? Say so explicitly, even if the impact is "none".
    validations:
      required: true
  - type: dropdown
    id: contribute
    attributes:
      label: Are you willing to contribute a pull request for this?
      options:
        - "Yes"
        - "No"
        - "Maybe, with guidance"
    validations:
      required: true
